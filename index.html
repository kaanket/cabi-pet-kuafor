<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15947f"><title>Cabi Pet Kuaför</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#173535;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}.app{max-width:500px;margin:auto;min-height:100vh;padding:20px 16px 100px}h1{margin:5px 0;font-size:27px}.muted{color:#71807f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.btn{border:0;border-radius:17px;padding:16px 12px;font-weight:700;font-size:15px;background:#dff4ef;color:#174b45}.primary{background:#15947f;color:#fff}.card{background:#fff;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 3px 14px #0000000a}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #edf1f0}.row:last-child{border:0}.tag{background:#eef7f5;padding:7px 10px;border-radius:10px;font-size:12px}.section{font-weight:800;font-size:19px;margin:22px 2px 10px}input,select,textarea{width:100%;padding:14px;border:1px solid #dce5e3;border-radius:13px;font-size:16px;margin:5px 0 10px;background:#fff}label{font-size:13px;font-weight:700}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:5}.sheet{background:#f7f9f8;width:100%;max-width:500px;margin:auto;border-radius:24px 24px 0 0;padding:20px;max-height:92vh;overflow:auto}.sheet h2{margin:0 0 15px}.actions{display:flex;gap:10px}.actions button{flex:1}.danger{background:#ffe8e8;color:#a33}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e7eceb;padding:9px 4px;display:flex;justify-content:space-around;z-index:4}.nav button{border:0;background:none;color:#657574;font-size:11px}.nav b{display:block;font-size:20px;margin-bottom:2px}.empty{padding:15px 0;color:#748381}
</style></head><body><div class="app">
<h1>🐾 Cabi Pet Kuaför</h1><div class="muted">Randevu · Müşteri · İşlem Geçmişi</div>
<div class="grid">
<button class="btn primary" onclick="openAppt()">➕<br>Yeni Randevu</button><button class="btn" onclick="openCustomer()">👤<br>Yeni Müşteri</button>
<button class="btn" onclick="focusSearch()">🔍<br>Müşteri Ara</button><button class="btn" onclick="openCalendar()">🗓️<br>Takvim</button>
<button class="btn" onclick="openRevenue()">💰<br>Ciro</button><button class="btn" onclick="backup()">💾<br>Yedek Al</button>
</div>
<div class="section">Bugünkü Randevular <span id="count" class="muted"></span></div><div id="appointments" class="card"></div>
<div class="section">Müşteri Ara</div><div class="card"><input id="search" oninput="renderCustomers()" placeholder="İsim, telefon veya hayvan adı"><div id="customers"></div></div>
</div>
<div class="nav"><button onclick="location.reload()"><b>⌂</b>Ana Sayfa</button><button onclick="openAppt()"><b>📅</b>Randevu</button><button onclick="openCustomer()"><b>🐾</b>Müşteriler</button><button onclick="openSettings()"><b>⚙️</b>Ayarlar</button></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script>
const KEY='cabi_pet_kuafor_v2';let db=JSON.parse(localStorage.getItem(KEY)||'{"customers":[],"appointments":[]}');
const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){renderAppts();renderCustomers()}
function renderAppts(){let d=new Date().toISOString().slice(0,10),a=db.appointments.filter(x=>x.date===d).sort((x,y)=>x.time.localeCompare(y.time));$('count').textContent='· '+a.length+' randevu';$('appointments').innerHTML=a.length?a.map(x=>`<div class="row" onclick="editAppt('${x.id}')"><div><b>${x.time} · ${esc(x.pet)}</b><br><small>${esc(x.service)} · ${esc(x.customer)}</small></div><span class="tag">${x.price||0} ₺</span></div>`).join(''):'<div class="empty">Bugün kayıtlı randevu yok.</div>'}
function renderCustomers(){let q=($('search').value||'').toLowerCase(),c=db.customers.filter(x=>(x.name+' '+x.phone+' '+x.pet+' '+x.breed).toLowerCase().includes(q));$('customers').innerHTML=c.length?c.map(x=>`<div class="row"><div><b>${esc(x.pet)}</b><br><small>${esc(x.name)} · ${esc(x.breed||'Irk yok')} · ${esc(x.phone)}</small></div><button class="btn" style="padding:9px 12px" onclick="detail('${x.id}')">Aç</button></div>`).join(''):'<div class="empty">Müşteri bulunamadı.</div>'}
function openCustomer(){ $('modalTitle').textContent='Yeni Müşteri';$('modalBody').innerHTML=`<label>Sahip adı</label><input id="cname" placeholder="Ad Soyad"><label>Telefon</label><input id="phone" type="tel" placeholder="05xx xxx xx xx"><label>Hayvan adı</label><input id="pet" placeholder="Boncuk"><label>Tür</label><select id="type"><option>Köpek</option><option>Kedi</option></select><label>Irk</label><input id="breed" placeholder="Toy Poodle"><label>Kilo (kg)</label><input id="weight" type="number" step=".1"><label>Özel not</label><textarea id="note" placeholder="Kesim şekli, davranış, özel istek..."></textarea><button class="btn primary" onclick="addCustomer()">Kaydet</button>`;$('modal').style.display='flex'}
function addCustomer(){if(!$('cname').value||!$('pet').value)return alert('Sahip adı ve hayvan adı gerekli.');db.customers.push({id:Date.now().toString(),name:$('cname').value,phone:$('phone').value,pet:$('pet').value,type:$('type').value,breed:$('breed').value,weight:$('weight').value,note:$('note').value});save();closeModal()}
function openAppt(){let opts=db.customers.map(x=>`<option value="${x.id}">${esc(x.pet)} — ${esc(x.name)}</option>`).join('');$('modalTitle').textContent='Yeni Randevu';$('modalBody').innerHTML=`<label>Müşteri / Hayvan</label><select id="cid">${opts||'<option value="">Önce müşteri ekleyin</option>'}</select><label>Tarih</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Saat</label><input id="time" type="time" value="10:00"><label>İşlem</label><select id="service"><option>Tıraş</option><option>Hijyen & Banyo</option><option>Kıtık açma</option><option>Tırnak / bakım</option></select><label>Ücret (₺)</label><input id="price" type="number" placeholder="1800"><label>Not</label><textarea id="anote"></textarea><button class="btn primary" onclick="addAppt()">Randevuyu Kaydet</button>`;$('modal').style.display='flex'}
function addAppt(){let c=db.customers.find(x=>x.id===$('cid').value);if(!c)return alert('Önce müşteri ekleyin.');db.appointments.push({id:Date.now().toString(),customer:c.name,pet:c.pet,date:$('date').value,time:$('time').value,service:$('service').value,price:$('price').value,note:$('anote').value});save();closeModal()}
function editAppt(id){let a=db.appointments.find(x=>x.id===id),opts=db.customers.map(x=>`<option value="${x.id}" ${x.pet===a.pet?'selected':''}>${esc(x.pet)} — ${esc(x.name)}</option>`).join('');$('modalTitle').textContent='Randevuyu Düzenle';$('modalBody').innerHTML=`<label>Müşteri</label><select id="ecid">${opts}</select><label>Tarih</label><input id="edate" type="date" value="${a.date}"><label>Saat</label><input id="etime" type="time" value="${a.time}"><label>İşlem</label><select id="eservice"><option>Tıraş</option><option>Hijyen & Banyo</option><option>Kıtık açma</option><option>Tırnak / bakım</option></select><label>Ücret</label><input id="eprice" type="number" value="${a.price||''}"><label>Not</label><textarea id="enote">${esc(a.note||'')}</textarea><div class="actions"><button class="btn primary" onclick="updateAppt('${id}')">Kaydet</button><button class="btn danger" onclick="deleteAppt('${id}')">Sil</button></div>`;$('modal').style.display='flex';$('eservice').value=a.service}
function updateAppt(id){let a=db.appointments.find(x=>x.id===id),c=db.customers.find(x=>x.id===$('ecid').value);Object.assign(a,{customer:c.name,pet:c.pet,date:$('edate').value,time:$('etime').value,service:$('eservice').value,price:$('eprice').value,note:$('enote').value});save();closeModal()}
function deleteAppt(id){if(confirm('Randevu silinsin mi?')){db.appointments=db.appointments.filter(x=>x.id!==id);save();closeModal()}}
function detail(id){let c=db.customers.find(x=>x.id===id),h=db.appointments.filter(a=>a.pet===c.pet).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));$('modalTitle').textContent=c.pet;$('modalBody').innerHTML=`<div class="card"><b>${esc(c.name)}</b><br>📞 ${esc(c.phone)}<br>🐾 ${esc(c.type)} · ${esc(c.breed)} · ${esc(c.weight)} kg<br><br>📝 ${esc(c.note||'Not yok')}</div><h3>İşlem geçmişi</h3>${h.length?h.map(a=>`<div class="row"><span>${a.date} · ${esc(a.service)}</span><b>${a.price||0} ₺</b></div>`).join(''):'<div class="empty">Henüz işlem yok.</div>'}<div class="actions"><button class="btn" onclick="whatsapp('${c.id}')">WhatsApp</button><button class="btn" onclick="closeModal()">Kapat</button></div>`;$('modal').style.display='flex'}
function whatsapp(id){let c=db.customers.find(x=>x.id===id),ph=(c.phone||'').replace(/\D/g,'');if(ph.startsWith('0'))ph='90'+ph.slice(1);if(!ph)return alert('Telefon numarası kayıtlı değil.');location.href='https://wa.me/'+ph+'?text='+encodeURIComponent('Merhaba '+c.name+', Cabi Pet Kuaför randevunuz için hatırlatma. 🐾')}
function openCalendar(){let d=new Date().toISOString().slice(0,10);$('modalTitle').textContent='Takvim';$('modalBody').innerHTML=`<input id="cal" type="date" value="${d}" onchange="calendarDay(this.value)"><div id="calList"></div>`;$('modal').style.display='flex';calendarDay(d)}
function calendarDay(d){let a=db.appointments.filter(x=>x.date===d).sort((x,y)=>x.time.localeCompare(y.time));$('calList').innerHTML=a.length?a.map(x=>`<div class="row"><div><b>${x.time} · ${esc(x.pet)}</b><br><small>${esc(x.service)} · ${esc(x.customer)}</small></div><button class="btn" style="padding:8px" onclick="editAppt('${x.id}')">Düzenle</button></div>`).join(''):'<div class="empty">Bu tarihte randevu yok.</div>'}
function openRevenue(){let ym=new Date().toISOString().slice(0,7),a=db.appointments.filter(x=>x.date.startsWith(ym)),t=a.reduce((n,x)=>n+Number(x.price||0),0);$('modalTitle').textContent='💰 Bu Ay';$('modalBody').innerHTML=`<div class="card"><small>Toplam ciro</small><h1>${t.toLocaleString('tr-TR')} ₺</h1><span class="muted">${a.length} işlem</span></div>`; $('modal').style.display='flex'}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cabi-pet-kuafor-yedek-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function openSettings(){$('modalTitle').textContent='Ayarlar / Yedek';$('modalBody').innerHTML=`<p>📱 Kayıtlar bu iPhone'un tarayıcısında saklanır.</p><button class="btn primary" onclick="backup()">💾 Yedek Dosyası Oluştur</button><br><br><label>Yedek geri yükle</label><input id="restore" type="file" accept=".json" onchange="restoreFile(event)"><p class="muted">Yedek almayı düzenli yaparsan telefon değişiminde kayıtlarını geri yükleyebilirsin.</p>`;$('modal').style.display='flex'}
function restoreFile(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.customers||!x.appointments)throw 0;if(confirm('Mevcut kayıtların üzerine yedek geri yüklensin mi?')){db=x;save();closeModal()}}catch(_){alert('Geçersiz yedek dosyası.')}};r.readAsText(f)}
function focusSearch(){$('search').focus();scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function closeModal(){$('modal').style.display='none'}render();
</script></body></html>
