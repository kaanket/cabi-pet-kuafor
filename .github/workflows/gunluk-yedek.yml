name: Cabi Pet Kuaför - Günlük Yedek

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: PostgreSQL yedeği al
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          test -n "$SUPABASE_DB_URL"
          mkdir -p backup

          CLEAN_DB_URL=$(python3 -c 'import os, urllib.parse; u=os.environ["SUPABASE_DB_URL"]; p=urllib.parse.urlsplit(u); q=[(k,v) for k,v in urllib.parse.parse_qsl(p.query, keep_blank_values=True) if k.lower() != "database"]; print(urllib.parse.urlunsplit((p.scheme,p.netloc,p.path or "/postgres",urllib.parse.urlencode(q),p.fragment)))')

          docker run --rm \
            -v "$PWD/backup:/backup" \
            postgres:17 \
            pg_dump "$CLEAN_DB_URL" \
            --format=custom \
            --file="/backup/cabi-pet-kuafor-$(date +%Y-%m-%d).dump"

      - name: Yedeği sakla
        uses: actions/upload-artifact@v4
        with:
          name: cabi-pet-kuafor-yedek-${{ github.run_id }}
          path: backup/*.dump
          retention-days: 7
